[project]
name = "dealradar"
version = "0.1.0"
description = "Deal Radar: findet und bewertet Geld- und Spar-Aktionen in DE/EU"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.12",
  "pydantic>=2.7",
  "pyyaml>=6",
  "python-dotenv>=1",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "feedparser>=6",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dealradar*"]
