# Täglicher Cloud-Lauf, unabhängig vom Mac.
# Modell: erst Gemini (kostenlose Stufe), wenn dessen Kontingent leer ist ein Open-Source-Modell
# (Gemma 3 4B über Ollama) direkt auf dem Runner – ohne Key, ohne Tageslimit. Benachrichtigung: GitHub-Issue (GitHub mailt es und pusht es in der GitHub-App). Der Vault-Kanal geht in der Cloud nicht.
# Die SQLite-Datenbank (Dedupe, Gesundheitsstatus) wird über den Actions-Cache von Lauf zu Lauf
# weitergereicht. Ungenutzte Caches löscht GitHub nach 7 Tagen – bei täglichem Lauf kein Problem.
name: deal-radar
on:
  schedule:
    # 08:15 UTC = 09:15 MEZ / 10:15 MESZ: kurz nach dem täglichen Reset des Gemini-Gratiskontingents
    # (Mitternacht Pazifikzeit). Früher am Morgen würde der Lauf das Restkontingent des Vortags erwischen.
    - cron: "15 8 * * *"
    # GitHub startet geplante Läufe unter Last oft Stunden zu spät (beobachtet: 18:40–20:15 UTC statt 08:15).
    # Darum mehrere Startzeiten; der Job "gate" lässt pro Tag nur den ersten erfolgreichen Lauf zu.
    - cron: "47 3 * * *"
    - cron: "47 5 * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Nur eine Testmail senden (kein Lauf)"
        type: boolean
        default: false
concurrency: { group: deal-radar, cancel-in-progress: false }
permissions: { contents: read, issues: write }
env:
  OLLAMA_MODEL: gemma3:4b
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    permissions: { actions: read }
    steps:
      - id: check
        env: { GH_TOKEN: "${{ github.token }}", EVENT: "${{ github.event_name }}" }
        run: |
          if [ "$EVENT" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          today=$(date -u +%F)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/dealradar.yml/runs?event=schedule&status=success&created=$today" -q '.total_count')
          echo "heute schon erfolgreich: $n"
          [ "$n" = "0" ] && echo "go=true" >> "$GITHUB_OUTPUT" || echo "go=false" >> "$GITHUB_OUTPUT"
  test-mail:
    if: ${{ inputs.test_mail }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: python -m dealradar test-mail
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
  run:
    needs: gate
    if: ${{ !inputs.test_mail && needs.gate.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - name: Datenbank vom letzten Lauf holen
        uses: actions/cache/restore@v4
        with:
          path: data
          key: dealradar-db-${{ github.run_id }}
          restore-keys: dealradar-db-
      - name: Open-Source-Modell zwischenspeichern
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}-v1
      - name: Ollama starten
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          mkdir -p ~/.ollama/models
          OLLAMA_MODELS=$HOME/.ollama/models nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          OLLAMA_MODELS=$HOME/.ollama/models ollama pull "$OLLAMA_MODEL"
          nproc; free -g | head -2
      - name: Deal Radar
        run: python -m dealradar run
        env:
          DEALRADAR_LLM_PROVIDER: auto
          DEALRADAR_OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
          DEALRADAR_OLLAMA_NUM_CTX: "8192"
          DEALRADAR_OLLAMA_MAX_CHARS: "9000"
          DEALRADAR_OLLAMA_MAX_MINUTES: "75"
          DEALRADAR_MAX_DEALS: "40"
          DEALRADAR_CHANNELS: github        # GitHub mailt neue Issues an alle, die das Repo beobachten; für SMTP zusätzlich ,email
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEALRADAR_GITHUB_NOTIFY: ${{ github.repository_owner }}   # @-Erwähnung -> GitHub mailt jeden Morgen
      - name: Datenbank sichern (auch nach Fehlern)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: dealradar-db-${{ github.run_id }}
      - name: Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: dealradar-log, path: logs/, retention-days: 14 }
